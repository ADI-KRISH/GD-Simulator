global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: gd-backend
    metrics_path: /metrics
    static_configs:
      # the FastAPI dev server running on the host
      - targets: ["host.docker.internal:8000"]

  - job_name: livekit
    static_configs:
      - targets: ["livekit:7880"]
